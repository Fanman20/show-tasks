<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Show Tasks">
<meta name="theme-color" content="#10131a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Show Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app, dark by design so it doesn't glow in the wings.
   Each show section carries its own spike-tape colour. */
:root{
  color-scheme:dark;
  --bg:#10131a; --surface:#181d28; --raised:#222a3b; --line:#2f3850;
  --fg:#eef1f7; --muted:#949db1; --accent:#f2c94c; --on-accent:#1b1504; --danger:#ff6b6b;
  --pre:#5aa9ff; --a1:#ff9f43; --a2:#d68cff; --post:#4fd1a5;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;
  padding:10px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar h1{flex:1;min-width:0;margin:0;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.bar .back{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 4px;font-size:17px}

main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
.screen{display:flex;flex-direction:column;gap:22px}
.label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .flabel{font-size:13px;color:var(--muted);font-weight:600}
.input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:17px;width:100%}
.input::placeholder{color:#636c80}
textarea.input{resize:vertical;min-height:84px}
.minsec{display:flex;align-items:center;gap:6px}
.minsec .input{width:76px;text-align:center}
.minsec span{color:var(--muted);font-size:14px}

/* section buttons */
.secgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.secgrid .full{grid-column:1/-1;min-height:62px}
.secbtn{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);
  padding:12px 12px 10px 20px;display:flex;flex-direction:column;gap:2px;min-height:84px;overflow:hidden}
.secbtn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--c)}
.secbtn.before::before{background:repeating-linear-gradient(180deg,var(--c) 0 8px,transparent 8px 13px)}
.secbtn .nm{font-family:var(--display);font-weight:700;font-size:25px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.secbtn .tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.secbtn .ct{color:var(--muted);font-size:14px}
.secbtn[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.secbtn[aria-pressed="true"] .ct{color:var(--fg)}

.runcard{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.runbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--c);border-radius:var(--r);
  background:color-mix(in srgb,var(--c) 12%,var(--surface));padding:12px 14px}
.runbtn .nm{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1.05}
.runbtn small{color:var(--muted);font-size:14px}

.addpanel{border-color:var(--c)}
.addhead{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none;display:inline-block}
.hint{font-size:13px;color:var(--muted);margin:0}
.row2{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row2 .field{flex:1;min-width:150px}

.btn{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:11px 16px;font-weight:600;font-size:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.big{padding:14px 18px;font-size:18px}
.btn.wide{width:100%}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#1a0505}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.recent{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.recent li{font-size:15px;color:var(--muted);border-left:3px solid var(--c);padding-left:8px}

.arrange{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arrange .full{grid-column:1/-1}
.arrbtn{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px}
.arrbtn span{flex:1;font-weight:600}
.arrbtn small{color:var(--muted)}
.foot{display:flex;gap:10px;flex-wrap:wrap}
.foot .btn{flex:1;min-width:140px}

/* section screen */
.sechead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r);background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid var(--c)}
.sechead .nm{flex:1;font-family:var(--display);font-weight:700;font-size:30px;text-transform:uppercase;line-height:1}
.sechead .meta{color:var(--muted);font-size:14px;text-align:right}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .btn{flex:1;min-width:120px;padding:10px 12px;font-size:15px}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.task.dragging{border-color:var(--accent);box-shadow:0 8px 24px #0009;background:var(--raised);position:relative;z-index:2}
.handle{flex:none;width:44px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;border:0;background:none;border-right:1px solid var(--line)}
.handle svg{width:18px;height:18px}
.num{flex:none;width:26px;padding-top:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:14px}
.body{flex:1;min-width:0;padding:10px 10px 10px 8px;display:flex;flex-direction:column;gap:6px}
.txt{border:0;background:none;text-align:left;padding:0;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.timepill{align-self:flex-start;border:1px dashed var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.timepill.set{border-style:solid;border-color:var(--c);color:var(--fg);font-weight:700}
.updown{flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.updown button{flex:1;width:44px;border:0;background:none;color:var(--muted);font-size:16px}
.updown button+button{border-top:1px solid var(--line)}
.updown button:disabled{opacity:.25}
.stamp{flex:none;width:88px;border:0;border-left:1px solid var(--line);background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);
  font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.stamp.flash{background:var(--accent);color:var(--on-accent)}
.empty{color:var(--muted);text-align:center;padding:24px 8px;border:1px dashed var(--line);border-radius:10px;margin:0}
.inlineadd{display:flex;gap:8px}
.inlineadd .input{flex:1;min-width:0}

/* running screen */
.runtop{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh,49px));z-index:4;background:var(--bg);
  margin:-16px -16px 0;padding:10px 16px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);box-shadow:0 10px 14px -10px #000c}
.acttabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acttab{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px;font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase}
.acttab[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.clock{border-color:var(--c);gap:14px;padding:14px 12px}
.clkgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:stretch}
.clkcol{display:flex;flex-direction:column;gap:1px}
.clk-label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c);white-space:nowrap}
.clk-big{font-family:var(--display);font-weight:700;font-size:68px;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clk-big.long{font-size:48px;line-height:1.35}
.clk-sub{color:var(--muted);font-size:13px;width:0;min-width:100%}  /* wraps to the clock's width instead of widening it */
.next{border-left:1px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:1px;min-width:0}
.next .nl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.next .nin{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.05;color:var(--accent);font-variant-numeric:tabular-nums;align-self:flex-start}
.next .ntx{font-size:18px;font-weight:600;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.next.soon .nin{color:var(--on-accent);background:var(--accent);border-radius:6px;padding:0 8px}
.clkbtns{display:flex;gap:8px}
.clkbtns .btn{flex:1;padding:12px 10px;font-size:16px}
.clkbtns .btn.big{padding:12px 10px;font-size:17px}

.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rrow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.rrow .at{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.rrow .tx{font-size:18px;line-height:1.3;overflow-wrap:anywhere;min-width:0}
.rrow .st{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.rrow.next{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.rrow.next .at,.rrow.next .st{color:var(--accent)}
.rrow.due{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.rrow.due .at,.rrow.due .st{color:var(--on-accent)}
.rrow.past{opacity:.5}
.rrow.done{opacity:.4}
.rrow.done .tx{text-decoration:line-through}
.rrow.done .st{color:var(--post)}
.brow{grid-template-columns:30px 1fr}
.box{width:26px;height:26px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-weight:700;color:var(--on-accent)}
.brow.done .box{background:var(--post);border-color:var(--post)}
.brow.done{opacity:.55}
.brow.done .tx{text-decoration:line-through}
.summary{border:1px dashed var(--line);background:none;border-radius:10px;padding:10px 12px;color:var(--muted);text-align:left;font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:500}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.rec{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}

/* print screen */
.ctrl{display:flex;align-items:center;gap:12px}
.ctrl input[type=range]{flex:1;accent-color:var(--accent)}
.ctrl output{min-width:60px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--bg);font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--bg))}
.pagecount{color:var(--muted);font-size:14px;margin:0}
#preview{display:flex;flex-direction:column;gap:14px}
.sheet{position:relative;width:100%;aspect-ratio:297/210;max-width:100%;overflow:hidden;border-radius:4px;box-shadow:0 2px 12px #0008;background:#fff}
.page{position:absolute;top:0;left:0;width:1123px;height:794px;transform-origin:0 0;transform:scale(var(--s,.3));
  background:#fff;color:#111;font-family:var(--body);padding:40px 48px 36px;display:flex;flex-direction:column}
.page .ph{display:flex;align-items:baseline;gap:18px;border-bottom:4px solid #111;padding-bottom:8px;margin-bottom:10px}
.page .ph .show{font-family:var(--display);font-weight:700;font-size:34px;text-transform:uppercase;flex:1}
.page .ph .for{font-size:20px;font-weight:600}
.page .pb{flex:1;overflow:hidden;display:flex;flex-direction:column}
.page .secrow{font-family:var(--display);font-weight:700;text-transform:uppercase;padding:4px 0 2px;display:flex;align-items:center;gap:12px}
.page .secrow i{display:inline-block;width:.7em;height:.7em;border-radius:3px;background:var(--c)}
.page .prow{display:grid;grid-template-columns:auto 4.6em 1fr;gap:.5em;align-items:baseline;padding:.18em 0;border-bottom:1px solid #ccc}
.page .prow .n{font-weight:700;color:#555;min-width:1.4em;text-align:right;font-variant-numeric:tabular-nums}
.page .prow .t{font-weight:700;font-variant-numeric:tabular-nums}
.page .pf{display:flex;justify-content:space-between;font-size:14px;color:#555;border-top:1px solid #999;padding-top:6px;margin-top:6px}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheetpanel{background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:640px;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88%;overflow:auto}
.sheetpanel h3{margin:0;font-family:var(--display);font-size:26px;text-transform:uppercase}
.sheetpanel p{margin:0;color:var(--muted)}
.sheetpanel ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:110px}
.bigtime{font-family:var(--display);font-size:56px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);
  background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;box-shadow:0 6px 20px #0008;text-align:center}

@media (prefers-reduced-motion:no-preference){
  .secbtn,.chip,.stamp,.rrow{transition:background .15s,border-color .15s,opacity .2s}
  .rrow.due,.next.soon .nin{animation:pulse 1s ease-in-out infinite alternate}
  @keyframes pulse{to{filter:brightness(1.25)}}
}

@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:#fff;padding:0}
  .bar,.noprint,.toast,.scrim{display:none!important}
  main{padding:0;max-width:none}
  #s-print > :not(#preview){display:none!important}
  #preview{gap:0}
  .sheet{aspect-ratio:auto;width:297mm;height:210mm;box-shadow:none;border-radius:0;break-after:page}
  .page{transform:none;width:297mm;height:210mm}
}
</style>
</head>
<body>

<header class="bar">
  <button class="back" id="back" hidden>&#8249; Back</button>
  <h1 id="title">Show Tasks</h1>
</header>

<main>
  <!-- HOME -->
  <section class="screen" id="s-home">
    <div class="card">
      <div class="field">
        <label for="showName">Show name</label>
        <input class="input" id="showName" autocomplete="off" placeholder="e.g. The Pirates of Penzance">
      </div>
      <div class="field">
        <label for="forWhom">Tasks are for</label>
        <input class="input" id="forWhom" autocomplete="off" placeholder="e.g. ASM Stage Left">
      </div>
    </div>

    <div>
      <p class="label">During the show</p>
      <div class="runcard" id="runcard"></div>
    </div>

    <div>
      <p class="label">1 · Pick where the task goes</p>
      <div class="secgrid" id="secgrid"></div>
    </div>

    <div class="card addpanel" id="addpanel" hidden>
      <div class="addhead"><span class="dot"></span><span id="addTo"></span></div>
      <div class="field">
        <label for="taskText">2 · Say or type the task</label>
        <textarea class="input" id="taskText" enterkeyhint="done" placeholder="Tap the microphone on your keyboard and speak"></textarea>
      </div>
      <div class="row2">
        <div class="field" id="clockField">
          <label for="taskTime">Time (optional)</label>
          <input class="input" type="time" id="taskTime">
        </div>
        <div class="field" id="atField">
          <span class="flabel">Time into the act (optional)</span>
          <div class="minsec">
            <input class="input" type="number" inputmode="numeric" min="0" id="atMin" placeholder="0" aria-label="Minutes"><span>min</span>
            <input class="input" type="number" inputmode="numeric" min="0" max="59" id="atSec" placeholder="00" aria-label="Seconds"><span>sec</span>
          </div>
        </div>
        <button class="btn primary big" id="addBtn">Add task</button>
      </div>
      <p class="label" id="recentLabel" style="margin:4px 0 0">Last added here</p>
      <ul class="recent" id="recent"></ul>
    </div>

    <div>
      <p class="label">3 · Put in order, set times, print</p>
      <div class="arrange" id="arrange"></div>
    </div>

    <div class="foot">
      <button class="btn" id="printAll">Print all sections</button>
      <button class="btn" id="shareBtn">Give this app to someone</button>
    </div>
    <button class="btn danger" id="newShow">Start a new show (clear all tasks)</button>
  </section>

  <!-- SECTION -->
  <section class="screen" id="s-section" hidden>
    <div class="sechead" id="sechead"><span class="nm" id="secName"></span><span class="meta" id="secMeta"></span></div>
    <div class="tools">
      <button class="btn" id="timingBtn" aria-pressed="false">Timing run</button>
      <button class="btn" id="sortBtn">Sort by time</button>
      <button class="btn primary" id="printSec">Print</button>
    </div>
    <p class="hint" id="secHint"></p>
    <ul class="list" id="list"></ul>
    <div class="inlineadd">
      <input class="input" id="inlineText" enterkeyhint="done" placeholder="Add another task…" autocomplete="off">
      <button class="btn primary" id="inlineAdd">Add</button>
    </div>
  </section>

  <!-- RUNNING -->
  <section class="screen" id="s-run" hidden>
    <!-- pinned: stays on screen while the task list scrolls underneath -->
    <div class="runtop">
      <div class="acttabs" id="acttabs">
        <button class="acttab" data-act="a1" style="--c:var(--a1)">Act 1</button>
        <button class="acttab" data-act="a2" style="--c:var(--a2)">Act 2</button>
      </div>
      <div class="card clock">
        <div class="clkgrid">
          <div class="clkcol">
            <div class="clk-label" id="clkLabel"></div>
            <div class="clk-big" id="clkBig">0:00</div>
            <div class="clk-sub" id="clkSub"></div>
          </div>
          <div class="next" id="next">
            <span class="nl" id="nextLabel">Next</span>
            <span class="nin" id="nextIn"></span>
            <span class="ntx" id="nextTx"></span>
          </div>
        </div>
        <div class="clkbtns" id="clkBtns"></div>
      </div>
    </div>
    <div id="beforeWrap">
      <p class="label" id="beforeLabel"></p>
      <ul class="rlist" id="beforeList"></ul>
    </div>
    <button class="summary" id="beforeSummary" hidden></button>
    <div>
      <p class="label" id="runLabel"></p>
      <ul class="rlist" id="runList"></ul>
    </div>
    <div id="goneWrap" hidden>
      <p class="label">Already gone</p>
      <ul class="rlist" id="goneList"></ul>
    </div>
    <label class="toggle rec">Rehearsal: tap a task to record its time <input type="checkbox" id="recMode"></label>
  </section>

  <!-- PRINT -->
  <section class="screen" id="s-print" hidden>
    <div class="card noprint">
      <div class="field">
        <label for="fontSize">Print text size</label>
        <div class="ctrl"><input type="range" id="fontSize" min="16" max="72" step="2"><output id="fontOut"></output></div>
      </div>
      <div class="field">
        <span class="flabel">Sections to print</span>
        <div class="chips" id="printChips"></div>
      </div>
      <label class="toggle">Start each section on a new page <input type="checkbox" id="newPage"></label>
      <button class="btn primary big wide" id="doPrint">Print · A4 landscape</button>
      <p class="pagecount" id="pageCount"></p>
    </div>
    <div id="preview"></div>
  </section>
</main>

<div id="sheetHost"></div>

<script>
(() => {
// kind 'clock' = optional clock time (7:42 pm); kind 'run' = time into the act (12:30)
const SECS = [
  {id:'pre',  name:'Pre-show',      nm:'Pre-show',   c:'var(--pre)',  print:'#1f6fd1', kind:'clock', full:true},
  {id:'b1',   name:'Before Act 1',  nm:'Act 1', tag:'Before',  c:'var(--a1)', print:'#e07a10', kind:'clock', act:'a1'},
  {id:'a1',   name:'Act 1 running', nm:'Act 1', tag:'Running', c:'var(--a1)', print:'#e07a10', kind:'run',   act:'a1'},
  {id:'b2',   name:'Before Act 2',  nm:'Act 2', tag:'Before',  c:'var(--a2)', print:'#9b3fd1', kind:'clock', act:'a2'},
  {id:'a2',   name:'Act 2 running', nm:'Act 2', tag:'Running', c:'var(--a2)', print:'#9b3fd1', kind:'run',   act:'a2'},
  {id:'post', name:'After show',    nm:'After show', c:'var(--post)', print:'#16956a', kind:'clock', full:true},
];
const ACTS = {a1:{name:'Act 1', before:'b1', run:'a1', c:'var(--a1)'}, a2:{name:'Act 2', before:'b2', run:'a2', c:'var(--a2)'}};
const KEY = 'showtasks.v1';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const secOf = id => SECS.find(s => s.id === id);
const isRun = id => secOf(id).kind === 'run';
const pad = n => String(n).padStart(2, '0');

function sample(){
  const t = (text, time='') => ({id:uid(), text, time, at:null});
  const r = (text, at) => ({id:uid(), text, time:'', at});
  return {
    v:2, show:'Example Show', forWhom:'ASM Stage Left', fontSize:36, newPage:true, printSecs:SECS.map(s => s.id),
    run:{a1:{start:'19:30', startedAt:null, done:{}, autoDay:null}, a2:{start:'', startedAt:null, done:{}, autoDay:null}},
    tasks:{
      pre:[t('Sweep and mop stage','18:30'), t('Check all props on SL table','18:45'), t('Radio check with SM','19:15')],
      b1:[t('Preset chair DS centre'), t('Set tea trolley SL'), t('Check sightlines are clear'), t('Standing by, tell SM')],
      a1:[r('Hand umbrella to Lead', 270), r('Fly in drop for Scene 2', 660), r('Strike tea trolley in blackout', 1095), r('Standby smoke machine', 1560), r('Set bench for Scene 4', 2490)],
      b2:[t('Reset hall table'), t('Letter on tray'), t('Clear Act 1 props off SL table')],
      a2:[r('Hand letter to Maid', 180), r('Thunder sheet cue', 900), r('Flowers ready for bows', 2280)],
      post:[t('Collect all hand props'), t('Lock prop cabinet'), t('Ghost light on')],
    }
  };
}
function migrate(s){
  if (!s || !s.tasks) return sample();
  if (s.v === 2) return s;
  if (s.show === 'Example Show') return sample();
  // version 1 had four sections with clock times; act times become time into the act
  const base = {a1:'19:30', a2:'20:45'};
  for (const a of ['a1','a2']) (s.tasks[a] || []).forEach(t => {
    if (t.time){ const [h,m] = t.time.split(':').map(Number), [bh,bm] = base[a].split(':').map(Number);
      t.at = Math.max(0, (h*60 + m) - (bh*60 + bm)) * 60; } else t.at = null;
    t.time = '';
  });
  s.tasks.b1 = s.tasks.b1 || []; s.tasks.b2 = s.tasks.b2 || [];
  s.printSecs = SECS.map(x => x.id);
  s.run = {a1:{start:'19:30', startedAt:null, done:{}, autoDay:null}, a2:{start:'', startedAt:null, done:{}, autoDay:null}};
  s.v = 2;
  return s;
}
// one-off: quick test cues so the Running page can be tried without waiting minutes
function addTestCues(s){
  if (s.testCuesAdded) return s;
  for (const a of ['a1', 'a2'])
    s.tasks[a].unshift(...[10, 20, 30, 35].map((at, i) => ({id:uid(), text:`Test cue ${i + 1} (${at} s)`, time:'', at})));
  s.testCuesAdded = true;
  return s;
}
let st;
try { st = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
st = addTestCues(migrate(st));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} };
save();

let addSec = null, curSec = null, timing = false, screen = 'home', runAct = 'a1';

function fmt(t){
  if (!t) return '';
  let [h, m] = t.split(':').map(Number);
  const ap = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return `${h}:${pad(m)} ${ap}`;
}
function fmtAt(s){
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`;
}
const timeLabel = (t, sec) => isRun(sec) ? (t.at != null ? fmtAt(t.at) + ' in' : '') : fmt(t.time);
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const clockOf = ms => { const d = new Date(ms); return fmt(`${pad(d.getHours())}:${pad(d.getMinutes())}`); };
const todayAt = hm => { const [h, m] = hm.split(':').map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime(); };
const todayKey = () => new Date().toDateString();
const plural = n => `${n} task${n === 1 ? '' : 's'}`;
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let toastT;
function toast(msg, ms=2200){
  let el = $('.toast');
  if (!el){ el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, ms);
}
// two-tap confirm for anything destructive
function arm(btn, armedText, fn){
  if (btn.dataset.armed){ delete btn.dataset.armed; fn(); return; }
  const orig = btn.textContent;
  btn.dataset.armed = '1'; btn.textContent = armedText; btn.classList.add('armed');
  setTimeout(() => { if (btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = orig; btn.classList.remove('armed'); } }, 4000);
}

/* ---------- act timers ---------- */
const elapsed = act => (Date.now() - st.run[act].startedAt) / 1000;
function resetAct(act){
  const r = st.run[act];
  r.startedAt = null; r.done = {}; r.autoDay = todayKey(); save();
}
function checkAuto(act){
  const r = st.run[act], now = Date.now();
  if (r.startedAt && now - r.startedAt > 6 * 3600e3){ r.startedAt = null; r.done = {}; save(); return true; }  // last night's show
  if (!r.startedAt && r.start && r.autoDay !== todayKey()){
    const sched = todayAt(r.start);
    if (now >= sched && now - sched < 3 * 3600e3){ r.startedAt = sched; r.autoDay = todayKey(); save(); return true; }
  }
  return false;
}

let wl = null;
async function wake(on){
  try {
    if (on && !wl && navigator.wakeLock){ wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => wl = null); }
    if (!on && wl){ await wl.release(); wl = null; }
  } catch(e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && screen === 'run') wake(true); });

/* ---------- navigation ---------- */
function go(name, arg){
  screen = name;
  ['home','section','run','print'].forEach(s => $('#s-' + s).hidden = s !== name);
  $('#back').hidden = name === 'home';
  wake(name === 'run');
  if (name === 'home'){ $('#title').textContent = st.show || 'Show Tasks'; renderHome(); }
  if (name === 'section'){ curSec = arg; timing = false; $('#title').textContent = st.show || 'Show Tasks'; renderSection(); }
  if (name === 'run'){ runAct = arg || runAct; $('#title').textContent = 'Running'; renderRun(); }
  if (name === 'print'){
    if (arg) st.printSecs = [arg];
    $('#title').textContent = 'Print';
    renderPrint();
  }
  window.scrollTo(0, 0);
}
$('#back').onclick = () => (screen === 'print' || screen === 'run') && curSec ? go('section', curSec) : go('home');

/* ---------- home ---------- */
$('#showName').value = st.show; $('#forWhom').value = st.forWhom;
$('#showName').oninput = e => { st.show = e.target.value; $('#title').textContent = st.show || 'Show Tasks'; save(); };
$('#forWhom').oninput = e => { st.forWhom = e.target.value; save(); };

function actStatus(act){
  const r = st.run[act];
  if (r.startedAt) return `Running · ${fmtAt(elapsed(act))}`;
  return r.start ? `Starts ${fmt(r.start)}` : 'Start by hand';
}
function renderHome(){
  curSec = null;
  $('#runcard').innerHTML = Object.entries(ACTS).map(([id, a]) => `
    <button class="runbtn" style="--c:${a.c}" data-run="${id}"><span class="nm">Run ${a.name}</span><small>${actStatus(id)}</small></button>`).join('');
  $('#secgrid').innerHTML = SECS.map(s => `
    <button class="secbtn ${s.full ? 'full' : ''} ${s.tag === 'Before' ? 'before' : ''}" style="--c:${s.c}" data-sec="${s.id}" aria-pressed="${addSec === s.id}">
      ${s.tag ? `<span class="tag">${s.tag}</span>` : ''}<span class="nm">${s.nm}</span><span class="ct">${plural(st.tasks[s.id].length)}</span>
    </button>`).join('');
  $('#arrange').innerHTML = SECS.map(s => `
    <button class="arrbtn ${s.full ? 'full' : ''}" data-open="${s.id}"><i class="dot" style="--c:${s.c}"></i><span>${s.name}</span><small>${st.tasks[s.id].length} &#8250;</small></button>`).join('');
  renderAdd();
}
$('#runcard').onclick = e => { const b = e.target.closest('[data-run]'); if (b) go('run', b.dataset.run); };
$('#secgrid').onclick = e => {
  const b = e.target.closest('[data-sec]'); if (!b) return;
  addSec = b.dataset.sec; renderHome();
  $('#taskText').focus();
};
$('#arrange').onclick = e => { const b = e.target.closest('[data-open]'); if (b) go('section', b.dataset.open); };

function renderAdd(){
  const p = $('#addpanel');
  if (!addSec){ p.hidden = true; return; }
  const s = secOf(addSec);
  p.hidden = false; p.style.setProperty('--c', s.c);
  $('#addTo').textContent = 'Adding to ' + s.name;
  $('#clockField').hidden = s.kind === 'run';
  $('#atField').hidden = s.kind !== 'run';
  const last = st.tasks[addSec].slice(-3).reverse();
  $('#recentLabel').hidden = !last.length;
  $('#recent').innerHTML = last.map(t => { const tl = timeLabel(t, addSec); return `<li style="--c:${s.c}">${esc(t.text)}${tl ? ' · ' + tl : ''}</li>`; }).join('');
}
function addTask(sec, text, time='', at=null){
  text = text.trim(); if (!text) return false;
  st.tasks[sec].push({id:uid(), text, time, at}); save(); return true;
}
function readMinSec(mEl, sEl){
  if (mEl.value === '' && sEl.value === '') return null;
  return (parseInt(mEl.value) || 0) * 60 + Math.min(59, parseInt(sEl.value) || 0);
}
$('#addBtn').onclick = () => {
  const run = isRun(addSec);
  const ok = addTask(addSec, $('#taskText').value, run ? '' : $('#taskTime').value, run ? readMinSec($('#atMin'), $('#atSec')) : null);
  if (!ok){ toast('Say or type a task first'); return; }
  $('#taskText').value = ''; $('#taskTime').value = ''; $('#atMin').value = ''; $('#atSec').value = '';
  toast('Added to ' + secOf(addSec).name); renderHome(); $('#taskText').focus();
};
$('#taskText').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('#addBtn').click(); } };
$('#printAll').onclick = () => { st.printSecs = SECS.map(s => s.id); go('print'); };

/* ---------- section ---------- */
function renderSection(){
  const s = secOf(curSec), list = st.tasks[curSec], run = s.kind === 'run';
  $('#s-section').style.setProperty('--c', s.c);
  $('#secName').textContent = s.name;
  $('#secMeta').innerHTML = `${plural(list.length)}<br>${esc(st.forWhom || '')}`;
  $('#timingBtn').textContent = run ? 'Record times' : 'Timing run';
  $('#timingBtn').setAttribute('aria-pressed', timing);
  $('#secHint').textContent = timing
    ? 'Timing run: tap STAMP when each job happens. It records the time on the clock right now.'
    : run
      ? 'Drag the grip, or use the arrows, to put tasks in order. Times here are time into the act. Record times opens the running clock for a rehearsal.'
      : 'Drag the grip on the left, or use the arrows, to put tasks in order. Tap a task to edit it, or the time to set one.';
  if (!list.length){ $('#list').innerHTML = `<li class="empty">No tasks in ${s.name} yet. Add one below.</li>`; return; }
  $('#list').innerHTML = list.map((t, i) => { const tl = timeLabel(t, curSec); return `
    <li class="task" data-id="${t.id}">
      ${timing ? '' : `<button class="handle" aria-label="Drag to reorder"><svg viewBox="0 0 20 20" fill="currentColor"><circle cx="7" cy="5" r="1.6"/><circle cx="13" cy="5" r="1.6"/><circle cx="7" cy="10" r="1.6"/><circle cx="13" cy="10" r="1.6"/><circle cx="7" cy="15" r="1.6"/><circle cx="13" cy="15" r="1.6"/></svg></button>`}
      <span class="num">${i + 1}</span>
      <div class="body">
        <button class="txt" data-edit>${esc(t.text)}</button>
        <button class="timepill ${tl ? 'set' : ''}" data-time>${tl || '+ add time'}</button>
      </div>
      ${timing
        ? `<button class="stamp" data-stamp>Stamp</button>`
        : `<div class="updown"><button data-up aria-label="Move up" ${i === 0 ? 'disabled' : ''}>&#9650;</button><button data-down aria-label="Move down" ${i === list.length - 1 ? 'disabled' : ''}>&#9660;</button></div>`}
    </li>`; }).join('');
}
const findTask = (id, sec=curSec) => st.tasks[sec].findIndex(t => t.id === id);

$('#list').onclick = e => {
  const row = e.target.closest('.task'); if (!row) return;
  const list = st.tasks[curSec], i = findTask(row.dataset.id);
  if (e.target.closest('[data-up]') && i > 0){ [list[i-1], list[i]] = [list[i], list[i-1]]; save(); renderSection(); }
  else if (e.target.closest('[data-down]') && i < list.length - 1){ [list[i+1], list[i]] = [list[i], list[i+1]]; save(); renderSection(); }
  else if (e.target.closest('[data-stamp]')){
    list[i].time = nowHM(); save();
    e.target.closest('[data-stamp]').classList.add('flash');
    toast(`Stamped ${fmt(list[i].time)}`);
    setTimeout(renderSection, 350);
  }
  else if (e.target.closest('[data-time]')) timeSheet(list[i]);
  else if (e.target.closest('[data-edit]')) editSheet(list[i]);
};

/* drag to reorder (touch + mouse) */
$('#list').addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle'); if (!h) return;
  e.preventDefault();
  const ul = $('#list'), row = h.closest('.task');
  row.classList.add('dragging');
  const move = ev => {
    const y = ev.clientY;
    if (y < 90) window.scrollBy(0, -12); else if (y > innerHeight - 90) window.scrollBy(0, 12);
    let before = null;
    for (const r of ul.children){
      if (r === row) continue;
      const b = r.getBoundingClientRect();
      if (y < b.top + b.height / 2){ before = r; break; }
    }
    if (before !== row.nextElementSibling && before !== row) ul.insertBefore(row, before);
  };
  const up = () => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', up);
    row.classList.remove('dragging');
    const order = [...ul.children].map(r => r.dataset.id);
    st.tasks[curSec].sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
    save(); renderSection();
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
});

$('#timingBtn').onclick = () => {
  if (isRun(curSec)){ $('#recMode').checked = true; go('run', secOf(curSec).act); return; }
  timing = !timing; renderSection();
};
$('#sortBtn').onclick = () => {
  const list = st.tasks[curSec], run = isRun(curSec);
  const has = t => run ? t.at != null : !!t.time;
  const timed = list.filter(has).sort((a, b) => run ? a.at - b.at : a.time.localeCompare(b.time));
  let k = 0;
  st.tasks[curSec] = list.map(t => has(t) ? timed[k++] : t);
  save(); renderSection(); toast('Timed tasks put in time order');
};
$('#printSec').onclick = () => go('print', curSec);
$('#inlineAdd').onclick = () => {
  if (addTask(curSec, $('#inlineText').value)){ $('#inlineText').value = ''; renderSection(); }
};
$('#inlineText').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); $('#inlineAdd').click(); } };

/* ---------- running ---------- */
let lastGoneKey = null, goUntil = 0, goText = '';
$('#acttabs').onclick = e => { const b = e.target.closest('[data-act]'); if (b){ runAct = b.dataset.act; goUntil = 0; renderRun(); } };

function renderRun(){
  const A = ACTS[runAct], r = st.run[runAct], started = !!r.startedAt;
  $('#s-run').style.setProperty('--c', A.c);
  document.querySelectorAll('.acttab').forEach(b => b.setAttribute('aria-pressed', b.dataset.act === runAct));
  $('#clkBtns').innerHTML = started
    ? `<button class="btn" id="cRestart">Restart from now</button><button class="btn danger" id="cReset">Stop and reset</button>`
    : `<button class="btn primary big" id="cStart">Start now</button><button class="btn" id="cSet">${r.start ? 'Change start time' : 'Set start time'}</button>`;

  const before = st.tasks[A.before], runs = st.tasks[A.run];
  const nDone = before.filter(t => r.done[t.id]).length;
  $('#beforeLabel').textContent = `Before ${A.name}`;
  $('#beforeWrap').hidden = started || !before.length;
  $('#beforeSummary').hidden = !started || !before.length;
  $('#beforeSummary').textContent = `Before ${A.name}: ${nDone} of ${before.length} done`;
  $('#beforeList').innerHTML = before.map(t => `
    <li class="rrow brow ${r.done[t.id] ? 'done' : ''}" data-id="${t.id}"><span class="box">${r.done[t.id] ? '&#10003;' : ''}</span><span class="tx">${esc(t.text)}</span></li>`).join('');
  $('#runLabel').textContent = `${A.name} running`;
  lastGoneKey = null;   // forces tickRun to rebuild both lists
  tickRun();
}
const rowHtml = t => `
    <li class="rrow" data-id="${t.id}"><span class="at">${t.at != null ? fmtAt(t.at) : '–'}</span><span class="tx">${esc(t.text)}</span><span class="st"></span></li>`;
// upcoming cues stay in your order; gone cues (time reached or ticked) drop to the bottom, latest first
function splitRuns(el, started){
  const r = st.run[runAct], runs = st.tasks[ACTS[runAct].run];
  const gone = t => r.done[t.id] || (started && t.at != null && el >= t.at);
  return {up: runs.filter(t => !gone(t)), gone: runs.filter(gone).sort((a, b) => (b.at ?? -1) - (a.at ?? -1))};
}
function tickRun(){
  const A = ACTS[runAct], r = st.run[runAct], started = !!r.startedAt, now = Date.now();
  const el = started ? elapsed(runAct) : 0;
  if (started){
    $('#clkLabel').textContent = `${A.name} running`;
    $('#clkBig').textContent = fmtAt(el);
    $('#clkSub').textContent = `Started ${clockOf(r.startedAt)} · now ${clockOf(now)}`;
  } else if (r.start){
    const until = (todayAt(r.start) - now) / 1000;
    $('#clkLabel').textContent = `Curtain up ${fmt(r.start)}`;
    $('#clkBig').textContent = until > 0 ? fmtAt(until) : '0:00';
    $('#clkSub').textContent = until > 0 ? `until ${A.name} starts by itself` : 'Tap Start now when the act begins';
  } else {
    $('#clkLabel').textContent = `${A.name} not started`;
    $('#clkBig').textContent = '0:00';
    $('#clkSub').textContent = 'Tap Start now when the act begins';
  }

  const runs = st.tasks[A.run];
  const {up, gone} = splitRuns(el, started);
  const key = gone.map(t => t.id).join(',');
  if (key !== lastGoneKey){
    if (lastGoneKey !== null){
      const was = lastGoneKey.split(',');
      const fired = gone.find(t => !was.includes(t.id) && !r.done[t.id]);
      if (fired){ goUntil = now + 10000; goText = fired.text; }
      if (started) window.scrollTo({top:0, behavior:'smooth'});
    }
    lastGoneKey = key;
    $('#runList').innerHTML = up.length ? up.map(rowHtml).join('')
      : `<li class="empty">${runs.length ? 'All cues have gone.' : `No running tasks for ${A.name} yet.`}</li>`;
    $('#goneWrap').hidden = !gone.length;
    $('#goneList').innerHTML = gone.map(rowHtml).join('');
  }
  let next = null;
  for (const t of up) if (t.at != null && (!next || t.at < next.at)) next = t;
  const nx = $('#next');
  if (started && now < goUntil){
    nx.hidden = false; nx.classList.add('soon');
    $('#nextLabel').textContent = 'Go now'; $('#nextIn').textContent = 'GO'; $('#nextTx').textContent = goText;
  } else if (!started){
    const first = runs.filter(t => t.at != null).sort((a, b) => a.at - b.at)[0];
    nx.hidden = !first; nx.classList.remove('soon');
    if (first){ $('#nextLabel').textContent = 'First cue'; $('#nextIn').textContent = `${fmtAt(first.at)} in`; $('#nextTx').textContent = first.text; }
  } else if (next){
    const left = next.at - el;
    nx.hidden = false; nx.classList.toggle('soon', left <= 30);
    $('#nextLabel').textContent = 'Next cue in';
    $('#nextIn').textContent = fmtAt(Math.ceil(left));
    $('#nextTx').textContent = next.text;
  } else {
    nx.hidden = false; nx.classList.remove('soon');
    $('#nextLabel').textContent = 'Next cue'; $('#nextIn').textContent = '–'; $('#nextTx').textContent = 'No more timed tasks in this act';
  }

  document.querySelectorAll('#runList .rrow, #goneList .rrow').forEach(li => {
    const t = runs.find(x => x.id === li.dataset.id); if (!t) return;
    let cls = '', txt = '';
    if (r.done[t.id]){ cls = 'done'; txt = '✓ done'; }
    else if (started && t.at != null){
      if (el >= t.at){ cls = 'past'; txt = 'gone'; }
      else { cls = t === next ? 'next' : ''; txt = `in ${Math.ceil((t.at - el) / 60)} min`; }
    }
    li.className = 'rrow ' + cls;
    li.querySelector('.st').textContent = txt;
  });
  $('#clkBig').classList.toggle('long', $('#clkBig').textContent.length > 5);
}
$('#clkBtns').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const r = st.run[runAct];
  if (b.id === 'cStart'){ r.startedAt = Date.now(); r.autoDay = todayKey(); save(); renderRun(); }
  if (b.id === 'cSet') startSheet();
  if (b.id === 'cRestart') arm(b, 'Tap again to restart', () => { r.startedAt = Date.now(); r.autoDay = todayKey(); goUntil = 0; save(); renderRun(); toast('Timer restarted from now'); });
  if (b.id === 'cReset') arm(b, 'Tap again to reset', () => { resetAct(runAct); goUntil = 0; renderRun(); toast(`${ACTS[runAct].name} reset`); });
};
$('#beforeList').onclick = e => {
  const li = e.target.closest('[data-id]'); if (!li) return;
  const r = st.run[runAct]; r.done[li.dataset.id] = !r.done[li.dataset.id]; save(); renderRun();
};
$('#beforeSummary').onclick = () => { $('#beforeWrap').hidden = !$('#beforeWrap').hidden; };
$('#runList').onclick = $('#goneList').onclick = e => {
  const li = e.target.closest('[data-id]'); if (!li) return;
  const r = st.run[runAct], id = li.dataset.id;
  if ($('#recMode').checked){
    if (!r.startedAt){ toast('Start the timer first'); return; }
    const t = st.tasks[ACTS[runAct].run].find(x => x.id === id);
    t.at = Math.floor(elapsed(runAct)); save(); renderRun(); toast(`Recorded ${fmtAt(t.at)} into the act`);
    return;
  }
  r.done[id] = !r.done[id]; save(); tickRun();
};
function startSheet(){
  const r = st.run[runAct], A = ACTS[runAct];
  openSheet(`
    <h3>${A.name} start time</h3>
    <p>The timer starts by itself at this time. You can still start it by hand if the curtain goes up late.</p>
    <input class="input" type="time" id="stIn" value="${r.start}">
    <div class="btnrow"><button class="btn" data-q="19:30">7:30 pm</button><button class="btn" data-q="13:00">1:00 pm</button><button class="btn" data-q="14:00">2:00 pm</button></div>
    <div class="btnrow"><button class="btn" id="stClear">No set time</button><button class="btn primary" id="stSave">Save</button></div>`,
  (el, close) => {
    const done = v => { r.start = v; r.autoDay = null; save(); close(); renderRun(); };
    el.querySelectorAll('[data-q]').forEach(b => b.onclick = () => el.querySelector('#stIn').value = b.dataset.q);
    el.querySelector('#stClear').onclick = () => done('');
    el.querySelector('#stSave').onclick = () => done(el.querySelector('#stIn').value);
  });
}

/* ---------- bottom sheets ---------- */
function openSheet(html, wire){
  const host = $('#sheetHost');
  host.innerHTML = `<div class="scrim"><div class="sheetpanel" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim = host.firstElementChild;
  const close = () => host.innerHTML = '';
  scrim.onclick = e => { if (e.target === scrim) close(); };
  wire(scrim, close);
}
function timeSheet(t){
  if (isRun(curSec)) return atSheet(t);
  openSheet(`
    <h3>Time for this task</h3>
    <p>${esc(t.text)}</p>
    <div class="bigtime">${t.time ? fmt(t.time) : '--:--'}</div>
    <button class="btn primary big wide" id="tsNow">Stamp now · ${fmt(nowHM())}</button>
    <div class="field"><label for="tsIn">Or type a time</label><input class="input" type="time" id="tsIn" value="${t.time}"></div>
    <div class="btnrow"><button class="btn" id="tsClear">Clear time</button><button class="btn primary" id="tsDone">Done</button></div>`,
  (el, close) => {
    const done = v => { t.time = v; save(); close(); renderSection(); };
    el.querySelector('#tsNow').onclick = () => done(nowHM());
    el.querySelector('#tsClear').onclick = () => done('');
    el.querySelector('#tsDone').onclick = () => done(el.querySelector('#tsIn').value);
  });
}
function atSheet(t){
  const act = secOf(curSec).act, running = !!st.run[act].startedAt;
  openSheet(`
    <h3>Time into ${ACTS[act].name}</h3>
    <p>${esc(t.text)}</p>
    <div class="bigtime">${t.at != null ? fmtAt(t.at) : '-:--'}</div>
    ${running ? `<button class="btn primary big wide" id="asNow">Stamp now · ${fmtAt(elapsed(act))} in</button>` : ''}
    <div class="field"><span class="flabel">Minutes and seconds after the act starts</span>
      <div class="minsec">
        <input class="input" type="number" inputmode="numeric" min="0" id="asMin" value="${t.at != null ? Math.floor(t.at / 60) : ''}" aria-label="Minutes"><span>min</span>
        <input class="input" type="number" inputmode="numeric" min="0" max="59" id="asSec" value="${t.at != null ? t.at % 60 : ''}" aria-label="Seconds"><span>sec</span>
      </div>
    </div>
    <div class="btnrow"><button class="btn" id="asClear">Clear time</button><button class="btn primary" id="asDone">Done</button></div>`,
  (el, close) => {
    const done = v => { t.at = v; save(); close(); renderSection(); };
    if (running) el.querySelector('#asNow').onclick = () => done(Math.floor(elapsed(act)));
    el.querySelector('#asClear').onclick = () => done(null);
    el.querySelector('#asDone').onclick = () => done(readMinSec(el.querySelector('#asMin'), el.querySelector('#asSec')));
  });
}
function editSheet(t){
  openSheet(`
    <h3>Edit task</h3>
    <textarea class="input" id="esText">${esc(t.text)}</textarea>
    <div class="field"><span class="flabel">Section</span>
      <div class="chips" id="esSecs">${SECS.map(s => `<button class="chip" style="--c:${s.c}" data-s="${s.id}" aria-pressed="${s.id === curSec}"><i class="dot"></i>${s.name}</button>`).join('')}</div>
    </div>
    <div class="btnrow"><button class="btn danger" id="esDel">Delete</button><button class="btn primary" id="esSave">Save</button></div>`,
  (el, close) => {
    let target = curSec;
    el.querySelector('#esSecs').onclick = e => {
      const b = e.target.closest('[data-s]'); if (!b) return;
      target = b.dataset.s;
      el.querySelectorAll('#esSecs .chip').forEach(c => c.setAttribute('aria-pressed', c === b));
    };
    el.querySelector('#esDel').onclick = e => arm(e.target, 'Tap again to delete', () => {
      st.tasks[curSec].splice(findTask(t.id), 1); save(); close(); renderSection();
    });
    el.querySelector('#esSave').onclick = () => {
      t.text = el.querySelector('#esText').value.trim() || t.text;
      if (target !== curSec){
        st.tasks[curSec].splice(findTask(t.id), 1); st.tasks[target].push(t);
        toast('Moved to ' + secOf(target).name);
      }
      save(); close(); renderSection();
    };
  });
}
$('#shareBtn').onclick = () => openSheet(`
  <h3>Give this app to someone</h3>
  <p>They only need the web address. Nothing to buy, no account.</p>
  <ol>
    <li>Send them the link by text or email.</li>
    <li>They open it in Safari on their iPhone.</li>
    <li>They tap the Share button, then <b>Add to Home Screen</b>.</li>
  </ol>
  <p>Each person's tasks stay on their own phone. Your list is not shared with them, and theirs is not shared with you.</p>
  <div class="input" style="font-size:15px;overflow-wrap:anywhere" id="appLink">https://fanman20.github.io/show-tasks/</div>
  <button class="btn primary big wide" id="copyLink">Copy link</button>`,
  (el, close) => {
    el.querySelector('#copyLink').onclick = () => {
      navigator.clipboard.writeText(el.querySelector('#appLink').textContent)
        .then(() => { toast('Link copied'); close(); })
        .catch(() => { const r = document.createRange(); r.selectNodeContents(el.querySelector('#appLink')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Link selected. Tap Copy.'); });
    };
  });

$('#newShow').onclick = e => arm(e.target, 'Tap again to clear every task', () => {
  e.target.classList.remove('armed'); e.target.textContent = 'Start a new show (clear all tasks)';
  SECS.forEach(s => st.tasks[s.id] = []); st.show = ''; st.forWhom = ''; addSec = null;
  resetAct('a1'); resetAct('a2');
  $('#showName').value = ''; $('#forWhom').value = '';
  save(); go('home'); toast('Cleared. Enter the new show name.');
});

/* ---------- print ---------- */
$('#fontSize').oninput = e => { st.fontSize = +e.target.value; save(); buildPages(); };
$('#newPage').onchange = e => { st.newPage = e.target.checked; save(); buildPages(); };
$('#printChips').onclick = e => {
  const b = e.target.closest('[data-p]'); if (!b) return;
  const id = b.dataset.p, on = st.printSecs.includes(id);
  st.printSecs = on ? st.printSecs.filter(x => x !== id) : SECS.map(s => s.id).filter(x => x === id || st.printSecs.includes(x));
  save(); renderPrint();
};
function renderPrint(){
  $('#fontSize').value = st.fontSize; $('#newPage').checked = st.newPage;
  $('#printChips').innerHTML = SECS.map(s => `<button class="chip" style="--c:${s.c}" data-p="${s.id}" aria-pressed="${st.printSecs.includes(s.id)}"><i class="dot"></i>${s.name}</button>`).join('');
  buildPages();
}
function buildPages(){
  $('#fontOut').textContent = st.fontSize + ' pt';
  const pv = $('#preview'); pv.innerHTML = '';
  const px = st.fontSize * 96 / 72;
  const pages = [];
  let body = null;
  const newPage = () => {
    const sheet = document.createElement('div'); sheet.className = 'sheet';
    sheet.innerHTML = `<div class="page"><div class="ph"><span class="show">${esc(st.show || 'Show')}</span><span class="for">${esc(st.forWhom || '')}</span></div><div class="pb"></div><div class="pf"><span>${new Date().toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}</span><span class="pn"></span></div></div>`;
    pv.appendChild(sheet); pages.push(sheet);
    body = sheet.querySelector('.pb'); body.style.fontSize = px + 'px';
  };
  const fits = el => { body.appendChild(el); if (body.scrollHeight <= body.clientHeight + 1 || body.children.length === 1) return true; el.remove(); return false; };
  const head = (s, cont) => { const h = document.createElement('div'); h.className = 'secrow'; h.style.setProperty('--c', s.print); h.style.fontSize = Math.max(px * 1.15, 26) + 'px'; h.innerHTML = `<i></i>${s.name}${cont ? ' (continued)' : ''}`; return h; };

  for (const s of SECS){
    if (!st.printSecs.includes(s.id)) continue;
    const list = st.tasks[s.id];
    if (!list.length) continue;
    if (!body || st.newPage) newPage();
    if (!fits(head(s))){ newPage(); fits(head(s)); }
    list.forEach((t, i) => {
      const r = document.createElement('div'); r.className = 'prow';
      const tl = s.kind === 'run' ? (t.at != null ? fmtAt(t.at) : '') : (t.time ? fmt(t.time).replace(' ', '&#8239;') : '');
      r.innerHTML = `<span class="n">${i + 1}</span><span class="t">${tl}</span><span>${esc(t.text)}</span>`;
      if (!fits(r)){ newPage(); fits(head(s, true)); fits(r); }
    });
  }
  if (!pages.length){ pv.innerHTML = '<p class="empty">Nothing to print. Pick a section with tasks in it.</p>'; $('#pageCount').textContent = ''; return; }
  pages.forEach((p, i) => p.querySelector('.pn').textContent = `Page ${i + 1} of ${pages.length}`);
  $('#pageCount').textContent = `${pages.length} A4 landscape page${pages.length === 1 ? '' : 's'} at ${st.fontSize} pt. Running times are time into the act.`;
  scalePages();
}
function scalePages(){
  document.querySelectorAll('.sheet').forEach(s => s.querySelector('.page').style.setProperty('--s', s.clientWidth / 1123));
}
addEventListener('resize', scalePages);
$('#doPrint').onclick = () => { try { window.print(); } catch(e) { toast('Printing is not available here'); } };

setInterval(() => {
  const changed = checkAuto('a1') | checkAuto('a2');
  if (screen === 'run'){ changed ? renderRun() : tickRun(); }
}, 500);

// the pinned Running box sits just under the title bar
const setBarH = () => document.documentElement.style.setProperty('--barh', $('.bar').offsetHeight + 'px');
setBarH(); addEventListener('resize', setBarH);

checkAuto('a1'); checkAuto('a2');
go('home');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
